# OPTIONAL: MAE-75 with its own 200-epoch schedule, for a fully matched ablation.
# (The epoch-200 checkpoint of the 400-epoch run has not finished its cosine decay.)
run_name: m75e200
mask_ratio: 0.75
epochs: 200
batch_size: 512
base_lr: 1.5e-4          # peak lr = base_lr * batch / 256 = 3e-4
lr: 1.0e-3               # chosen by the 20-epoch LR check (beat the scaling-rule 3e-4); null = use base_lr rule
warmup_epochs: 20
weight_decay: 0.05
betas: [0.9, 0.95]
amp: true                # fp16 autocast + GradScaler (T4 has no fast bf16)
clip_grad: null          # set to 1.0 only if fp16 NaNs recur
norm_pix_loss: true
dec_dim: 128
dec_depth: 4
dec_heads: 4
seed: 0
ckpt_every: 25           # full resumable checkpoint (ckpt_latest.pt, overwritten)
encoder_save_every: 50   # encoder-only weights kept for downstream use
recon_every: 50
recon_indices: [0, 1, 2, 3, 4, 5, 6, 7]   # fixed held-out test images
data_root: ./data
download: true
